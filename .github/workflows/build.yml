name: Build pinswitch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        goarch:
          - 386

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch ${{ matrix.goarch }}
          Get-ChildItem -Path . -Filter "*.syso" | Select-Object Name, Length

      - name: Build EXE
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOOS: 'windows'
          GOARCH: ${{ matrix.goarch }}
        run: |
          New-Item -ItemType Directory -Force -Path "release"
          go build -mod=readonly -ldflags="-s -w -H=windowsgui" -o "release/pinswitch.exe" .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinswitch-windows-${{ matrix.goarch }}
          path: release/pinswitch.exe
          if-no-files-found: error
          retention-days: 14
