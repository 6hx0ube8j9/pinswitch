name: Build pinswitch

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: true

      - name: Verify Dependencies
        shell: pwsh
        run: |
          go mod download

      - name: Generate Windows Resources
        shell: pwsh
        run: |
          if (!(Test-Path "icons/app.ico")) {
            Write-Error "File icons/app.ico not found. Please check the path!"
            exit 1
          }
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --arch 386

      - name: Build EXE
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: "windows"
          GOARCH: "386"
        run: |
          go build -mod=readonly -ldflags="-s -w -H=windowsgui" -o pinswitch.exe .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinswitch-windows-386
          path: pinswitch.exe
          if-no-files-found: error
          retention-days: 14
